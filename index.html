<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sintetizador Biométrico e Poético da Alma</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center center;
            transition: background-image 0.5s ease-in-out;
        }

        header {
            width: 100%;
            padding: 12px;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        header h1 {
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        nav {
            width: 100%;
            padding: 12px 8px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-emotion {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 6px 12px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .btn-emotion:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <h1>Sintetizador Biométrico e Poético da Alma</h1>
    </header>

    <nav>
        <button class="btn-emotion" onclick="setEmotion('gratidao.png')">Gratidão</button>
        <button class="btn-emotion" onclick="setEmotion('alegria.png')">Alegria</button>
        <button class="btn-emotion" onclick="setEmotion('alegria_lagrimas.png')">Lágrimas de Alegria</button>
        <button class="btn-emotion" onclick="setEmotion('paz.png')">Paz</button>
        <button class="btn-emotion" onclick="setEmotion('tristeza.png')">Tristeza</button>
        <button class="btn-emotion" onclick="setEmotion('dor_da_alma.png')">Dor da Alma</button>
        <button class="btn-emotion" onclick="setEmotion('raiva.png')">Raiva</button>
        <button class="btn-emotion" onclick="setEmotion('lagrimas_raiva.png')">Lágrimas de Raiva</button>
        <button class="btn-emotion" onclick="setEmotion('medo.png')">Medo</button>
    </nav>

    <script>
        function setEmotion(imageName) {
            document.body.style.backgroundImage = `url('${imageName}')`;
        }

        // Inicializa com Gratidão
        setEmotion('gratidao.png');
    </script>
</body>
</html>
