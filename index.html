<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sintetizador Biométrico e Poético da Alma</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 12px;
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        header h1 {
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .image-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 10px;
            overflow: hidden;
        }

        .image-container img {
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            transition: opacity 0.3s ease;
        }

        nav {
            width: 100%;
            padding: 12px 8px;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-emotion {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 8px 12px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        .btn-home {
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            color: #000;
            font-weight: bold;
            border: none;
        }

        .btn-emotion:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <header>
        <h1>Sintetizador Biométrico e Poético da Alma</h1>
    </header>

    <div class="image-container">
        <img id="display-image" src="assets/dashboard.png" alt="Dashboard Principal" onerror="handleError(this)">
    </div>

    <nav>
        <button class="btn-emotion btn-home" onclick="setEmotion('dashboard')">🏠 Início</button>
        <button class="btn-emotion" onclick="setEmotion('gratidao')">Gratidão</button>
        <button class="btn-emotion" onclick="setEmotion('alegria')">Alegria</button>
        <button class="btn-emotion" onclick="setEmotion('alegria_lagrimas')">Lágrimas de Alegria</button>
        <button class="btn-emotion" onclick="setEmotion('paz')">Paz</button>
        <button class="btn-emotion" onclick="setEmotion('tristeza')">Tristeza</button>
        <button class="btn-emotion" onclick="setEmotion('dor_da_alma')">Dor da Alma</button>
        <button class="btn-emotion" onclick="setEmotion('raiva')">Raiva</button>
        <button class="btn-emotion" onclick="setEmotion('lagrimas_raiva')">Lágrimas de Raiva</button>
        <button class="btn-emotion" onclick="setEmotion('medo')">Medo</button>
        <button class="btn-emotion" onclick="setEmotion('nascer_do_sol')">Nascer do Sol</button>
    </nav>

    <script>
        const imageMap = {
            dashboard: ['assets/dashboard.png', 'assets/dashboard.jpg'],
            gratidao: ['assets/gratidao.png', 'assets/gratidao.jpg'],
            alegria: ['assets/alegria.png', 'assets/alegria.jpg'],
            alegria_lagrimas.png: ['assets/alegria_lagrimas.jpg'], 'assets/alegria_lagrimas.jpg', 'assets/alegria.png'],
            paz: ['assets/paz.png', 'assets/paz.jpg'],
            tristeza: ['assets/tristeza.png', 'assets/tristeza.jpg'],
            dor_da_alma: ['assets/dor_da_alma.png', 'assets/dor_da_alma.jpg'],
            raiva: ['assets/raiva.png', 'assets/raiva.jpg'],
            lagrimas_raiva: ['assets/lagrimas_raiva.png', 'assets/lagrimas_raiva.jpg'],
            medo: ['assets/medo.png', 'assets/medo.jpg'],
            nascer_do_sol: ['assets/nascer_do _sol.png', 'assets/nascer_do _sol.jpg', 'assets/nascer_do_sol.png']
        };

        let currentEmotion = 'dashboard';
        let currentAttempt = 0;

        function setEmotion(key) {
            currentEmotion = key;
            currentAttempt = 0;
            loadImage();
        }

        function loadImage() {
            const imgElement = document.getElementById('display-image');
            const sources = imageMap[currentEmotion];
            if (sources && currentAttempt < sources.length) {
                imgElement.src = sources[currentAttempt];
            }
        }

        function handleError(img) {
            currentAttempt++;
            const sources = imageMap[currentEmotion];
            if (sources && currentAttempt < sources.length) {
                img.src = sources[currentAttempt];
            }
        }
    </script>
</body>
</html>
