<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto 5º Elemento - Lágrimas Cinemáticas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #050505;
      color: #e2e8f0;
      font-family: 'Segoe UI', Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 650px;
      width: 100%;
      background: #0d0d0d;
      border: 1px solid #262626;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 1.4rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #f8fafc;
      margin-bottom: 4px;
      font-weight: 300;
    }

    p.sub {
      font-size: 0.8rem;
      color: #737373;
      margin-bottom: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* QUADRO FOTOGRÁFICO DO OLHO */
    .photo-frame {
      position: relative;
      width: 100%;
      height: 320px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #404040;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
      margin-bottom: 25px;
    }

    .eye-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) contrast(110%);
      transition: filter 0.8s ease;
    }

    /* GOTA DE LÁGRIMA REALISTA (GLASSMORPHISM) */
    .tear-drop {
      position: absolute;
      top: 55%; /* Origem próximo ao canto/pálpebra */
      left: 38%;
      width: 14px;
      height: 22px;
      border-radius: 50% 50% 35% 35%;
      background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.2) 60%, rgba(255,255,255,0.7) 100%);
      box-shadow: inset -1px -1px 2px rgba(255,255,255,0.8),
                  inset 1px 1px 3px rgba(0,0,0,0.4),
                  0 4px 8px rgba(0,0,0,0.3);
      backdrop-filter: blur(1px);
      opacity: 0;
      pointer-events: none;
    }

    @keyframes dropReal {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0.5);
      }
      15% {
        opacity: 1;
        transform: translateY(8px) scale(1);
      }
      75% {
        opacity: 0.85;
      }
      100% {
        opacity: 0;
        transform: translateY(110px) scale(0.7);
      }
    }

    .tear-drop.animating {
      animation: dropReal linear forwards;
    }

    /* BOTÕES MINIMALISTAS */
    .controls {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
      margin-bottom: 20px;
    }

    button {
      flex: 1;
      background: #171717;
      color: #a3a3a3;
      border: 1px solid #404040;
      padding: 12px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #262626;
      color: #ffffff;
      border-color: #737373;
    }

    /* PAINEL POÉTICO/BIOLÓGICO */
    .quote-panel {
      width: 100%;
      padding: 15px;
      background: #121212;
      border-left: 2px solid #525252;
      border-radius: 0 6px 6px 0;
      font-style: italic;
      font-size: 0.9rem;
      color: #d4d4d4;
      min-height: 60px;
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>PROJETO 5º ELEMENTO</h1>
    <p class="sub">Sintetizador Emocional de Lágrimas</p>

    <!-- Quadro da Fotografia -->
    <div class="photo-frame">
      <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?q=80&w=800&auto=format&fit=crop" id="eyePhoto" class="eye-photo" alt="Olho Humano">
      <div class="tear-drop" id="tearDrop"></div>
    </div>

    <!-- Controles -->
    <div class="controls">
      <button onclick="triggerEmotion('tristeza')">Tristeza</button>
      <button onclick="triggerEmotion('alegria')">Alegria</button>
      <button onclick="triggerEmotion('raiva')">Raiva</button>
      <button onclick="triggerEmotion('paz')">Paz</button>
    </div>

    <!-- Texto de Impacto -->
    <div class="quote-panel" id="quotePanel">
      "As lágrimas são a linguagem silenciosa do corpo quando a voz não alcança..."
    </div>
  </div>

  <script>
    const eyePhoto = document.getElementById('eyePhoto');
    const tearDrop = document.getElementById('tearDrop');
    const quotePanel = document.getElementById('quotePanel');

    const emotions = {
      tristeza: {
        filter: 'grayscale(100%) contrast(120%) brightness(85%)',
        duration: 4.0,
        glow: 'inset -1px -1px 2px rgba(255,255,255,0.8), 0 0 10px rgba(59, 130, 246, 0.5)',
        quote: '"Lágrimas de tristeza são o alívio da alma. Ricas em cortisol, elas descarregam o peso do sistema."'
      },
      alegria: {
        filter: 'grayscale(30%) sepia(20%) contrast(105%) brightness(110%)',
        duration: 2.2,
        glow: 'inset -1px -1px 2px rgba(255,255,255,0.9), 0 0 12px rgba(250, 204, 21, 0.6)',
        quote: '"Lágrimas de alegria transbordam gratidão. Carregadas de endorfina, elas celebram a vida."'
      },
      raiva: {
        filter: 'grayscale(80%) sepia(40%) hue-rotate(-50deg) contrast(140%)',
        duration: 1.3,
        glow: 'inset -1px -1px 2px rgba(255,255,255,0.8), 0 0 10px rgba(239, 68, 68, 0.6)',
        quote: '"Lágrimas de raiva nascem da alta pressão interna. Uma tentativa do corpo de restaurar o controle."'
      },
      paz: {
        filter: 'grayscale(60%) contrast(95%) brightness(105%)',
        duration: 3.0,
        glow: 'inset -1px -1px 2px rgba(255,255,255,0.9), 0 0 10px rgba(103, 232, 249, 0.5)',
        quote: '"Lágrimas de paz são o sereno após a tempestade. Simbolizam o equilíbrio e a quietude da mente."'
      }
    };

    function triggerEmotion(type) {
      const config = emotions[type];
      if (!config) return;

      // Reseta a animação da lágrima
      tearDrop.classList.remove('animating');
      void tearDrop.offsetWidth;

      // Aplica o filtro dramático na fotografia
      eyePhoto.style.filter = config.filter;

      // Aplica o brilho e duração da gota
      tearDrop.style.boxShadow = config.glow;
      tearDrop.style.animationDuration = `${config.duration}s`;

      // Atualiza o texto
      quotePanel.textContent = config.quote;

      // Inicia o escorrimento
      tearDrop.classList.add('animating');
    }
  </script>
</body>
</html>
