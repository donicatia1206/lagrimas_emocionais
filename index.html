<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto 5º Elemento - Sintetizador Biométrico de Lágrimas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #080d1a;
      color: #00f2fe;
      font-family: 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 680px;
      width: 100%;
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #00f2fe;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 1.4rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #00f2fe;
      margin-bottom: 4px;
      text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
    }

    p.sub {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .image-frame {
      width: 100%;
      height: 340px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(0, 242, 254, 0.3);
      margin-bottom: 20px;
      background-color: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
    }

    .image-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.4s ease-in-out;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      margin-bottom: 20px;
    }

    .button-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    button {
      flex: 1;
      background: #0f172a;
      color: #00f2fe;
      border: 1px solid #00f2fe;
      padding: 10px 6px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #00f2fe;
      color: #080d1a;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
      transform: translateY(-2px);
    }

    .status-panel {
      width: 100%;
      background: rgba(8, 13, 26, 0.8);
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.85rem;
      text-align: center;
      color: #e2e8f0;
      min-height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>PROJETO 5º ELEMENTO</h1>
    <p class="sub">Sintetizador Biométrico de Lágrimas</p>

    <div class="image-frame">
      <img id="emotionImage" src="gratidao.jpg" alt="Expressão de Gratidão">
    </div>

    <div class="controls">
      <div class="button-row">
        <button onclick="setEmotion('gratidao')">Gratidão</button>
        <button onclick="setEmotion('dor')">Dor da Alma</button>
        <button onclick="setEmotion('tristeza')">Tristeza</button>
      </div>
      <div class="button-row">
        <button onclick="setEmotion('alegria')">Alegria</button>
        <button onclick="setEmotion('paz')">Paz</button>
        <button onclick="setEmotion('raiva')">Raiva</button>
      </div>
    </div>

    <div class="status-panel" id="statusPanel">
      GRATIDÃO: O olhar foca a beleza do encontro. Alta carga de oxitocina, dopamina e reconhecimento da vida.
    </div>
  </div>

  <script>
    const emotionImage = document.getElementById('emotionImage');
    const statusPanel = document.getElementById('statusPanel');

    const emotions = {
      gratidao: {
        img: 'gratidao.jpg',
        msg: 'GRATIDÃO: O olhar foca a beleza do encontro. Alta carga de oxitocina, dopamina e reconhecimento da vida.'
      },
      dor: {
        img: 'dor_na_alma.jpg',
        msg: 'DOR DA ALMA & FÍSICA: O olhar desvia para o horizonte buscando o invisível. Presença de leucina-encefalina (analgésico natural).'
      },
      tristeza: {
        img: 'tristeza.jpg',
        msg: 'TRISTEZA: Processo de alívio e descompressão do organismo. Gotas densas enriquecidas com cortisol.'
      },
      alegria: {
        img: 'alegria.jpg',
        msg: 'ALEGRIA: Transbordamento celular e celebração em abundância de endorfina.'
      },
      paz: {
        img: 'paz.jpg',
        msg: 'PAZ: Estado de quietude, serenidade e restauração homeostática do sistema.'
      },
      raiva: {
        img: 'raiva.jpg',
        msg: 'RAIVA: Descarga adrenérgica sob alta pressão interna, com miose (contração) e tensão na expressão.'
      }
    };

    function setEmotion(type) {
      const config = emotions[type];
      if (!config) return;

      emotionImage.style.opacity = '0.2';
      setTimeout(() => {
        emotionImage.src = config.img;
        emotionImage.style.opacity = '1';
      }, 150);

      statusPanel.textContent = config.msg;
    }
  </script>
</body>
</html>
